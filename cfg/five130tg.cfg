# Five-130TG UI / theme config
# Format: key=value (как MatchStore). Версия приложения: 0.002
app.version=0.002
app.rev=050

# Режим игры (этап 1 PvP: hot-seat на одном устройстве)
game.mode.default=ai
game.mode.pvp.label=Два игрока (одно устройство)
game.mode.ai.label=Против ИИ
app.name=Пятак-130
app.locale_default=ru

# Colors (CSS / canvas)
color.bg=#1b4d3e
color.felt=#164536
color.text=#f5f0e6
color.muted=rgba(245,240,230,0.75)
color.accent=#c9a227
color.arrow=#ff3b5c
color.arrow.up=#3b82f6
color.arrow.down=#ff3b5c
color.arrow.left=#a855f7
color.arrow.right=#eab308
color.warn=#ffd24a
color.matchup=#ffd24a
color.tile.face=#f5f0e6
color.tile.ai=#e8eef5
color.pip.human=#8b6914
color.pip.ai=#3a5a8c
# Закрытый спиннер (якорь): пресеты rust|amber|slate|ink (default amber)
ui.spinner.style=amber
# Активные цвета заполняются из пресета; можно переопределить вручную.
color.spinner.border=#b8860b
color.spinner.face=#fff3d6
color.spinner.pip=#6b4a12
# Пресеты якоря + последний ход (docs/UI_APPEARANCE.md §2)
spinner.style.rust.border=#6b3f1e
spinner.style.rust.face=#efe4d4
spinner.style.rust.pip=#5c3317
spinner.style.rust.last.border=#8b4513
spinner.style.rust.last.face=#f7efe6
spinner.style.rust.last.pip=#b71c1c
spinner.style.amber.border=#b8860b
spinner.style.amber.face=#fff3d6
spinner.style.amber.pip=#6b4a12
spinner.style.amber.last.border=#a67c00
spinner.style.amber.last.face=#fff8e7
spinner.style.amber.last.pip=#c62828
spinner.style.slate.border=#4a5d73
spinner.style.slate.face=#e2e8f0
spinner.style.slate.pip=#2f3e4f
spinner.style.slate.last.border=#546e7a
spinner.style.slate.last.face=#eef2f6
spinner.style.slate.last.pip=#1565c0
spinner.style.ink.border=#3d2914
spinner.style.ink.face=#f0ebe3
spinner.style.ink.pip=#3d2914
spinner.style.ink.last.border=#5d4037
spinner.style.ink.last.face=#f5f0ea
spinner.style.ink.last.pip=#6a1b9a
color.center.border=#d4a017
color.opening.border=#ffd24a
# Активный последний ход (из пресета amber)
color.last.border=#a67c00
color.last.face=#fff8e7
color.last.pip=#c62828

# Fonts
font.ui="Segoe UI", system-ui, -apple-system, sans-serif
font.size.title=1.15rem
font.size.status=0.82rem
font.size.log=0.72rem
font.size.hand_label=0.75rem

# Верхняя полоса: часы и участники (docs/UI_APPEARANCE.md — обязательно)
ui.clock.enabled=1
ui.clock.format=YY/MM/DD HH:MM:SS
ui.clock.font_size=1.35rem
ui.weekday.enabled=1
ui.matchup.enabled=1
player.name.0=Вы
player.name.1=ИИ

# Board layout
board.cell.max_px=40
board.cell.scale.normal=0.55
# Множитель размера при ≤2 камнях на столе (≥1). Legacy 0.275 больше не использовать.
board.cell.scale.start=1.2
board.gap=0.14
board.tile.w_horiz=1.72
board.tile.h_horiz=0.88
board.tile.w_vert=0.88
board.tile.h_vert=1.72

# UI thresholds
ui.stones.low_threshold=2
ui.hand.tile_w_px=34
ui.hand.tile_h_px=68
ui.log.max_vh=42

# Debug export
debug.filename_prefix=five130tg_debug_v
debug.include_gfx=1

# --- Layout / bends (docs/BEND_REQUIREMENTS.md) ---
# Активный профиль. Все profile.* остаются для тестов; лишние уберём после прогона.
board.layout_profile=A
board.bend.only_vertical_ccw=1
board.bend.only_vertical_left=0
board.bend.main_line=0
board.margin=0.06
board.cell.scale.start=1.2
board.cell.min_px=22

# Profile A (active defaults duplicated below for clarity)
profile.A.bend.occupy=0.70
profile.A.shrink.occupy=0.80
profile.A.shrink.target=0.78
profile.A.cell.pref_frac=0.14
profile.A.cell.max_px=44

profile.B.bend.occupy=0.75
profile.B.shrink.occupy=0.80
profile.B.shrink.target=0.75
profile.B.cell.pref_frac=0.12
profile.B.cell.max_px=40

profile.C.bend.occupy=0.80
profile.C.shrink.occupy=0.85
profile.C.shrink.target=0.80
profile.C.cell.pref_frac=0.13
profile.C.cell.max_px=42

profile.D.bend.occupy=0.65
profile.D.shrink.occupy=0.80
profile.D.shrink.target=0.70
profile.D.cell.pref_frac=0.15
profile.D.cell.max_px=48

profile.E.bend.occupy=0.80
profile.E.shrink.occupy=0.80
profile.E.shrink.target=0.80
profile.E.cell.pref_frac=0.12
profile.E.cell.max_px=40

# Active keys (mirror of profile A — applyCfg also loads profile.<id>.*)
board.bend.occupy=0.70
board.shrink.occupy=0.80
board.shrink.target=0.78
board.cell.pref_frac=0.14
board.cell.max_px=44

# --- Server / Valkey (docs/plans/SERVER_VALKEY_CPP.md) ---
# Offline-only путь на стоп. Локальная разработка: 127.0.0.1
server.enabled=1
server.mode=localhost
server.valkey.host=127.0.0.1
server.valkey.port=6379
server.valkey.db=0
server.valkey.password=
server.valkey.prefix=five130tg:
server.daemon.pidfile=server/run/five130d.pid
server.daemon.logfile=server/run/five130d.log
server.daemon.foreground=1
server.daemon.version=0.003.0
# HTTP RPC для Mini App (localhost). 0 = выключить HTTP.
server.http.port=7380
server.http.enabled=1
# URL, который читает MatchStore в браузере (пусто = облако выкл.)
# Mini App на github.io (HTTPS) не может ходить на http://127.0.0.1 — нужен туннель.
# Локальный демон: http://127.0.0.1:7380 ; туннель: ./server/scripts/start_ssh_tunnel.sh
server.cloud_url=https://e8c888275e0fda.lhr.life
server.match.snap_ttl_sec=1209600
server.match.full_max=50
# Telegram ids с правами админ-панели (CSV), bk1804
server.admin.telegram_ids=545375021
