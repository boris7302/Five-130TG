# Five-130TG UI / theme config
# Format: key=value (как MatchStore). Версия приложения: 0.001
app.version=0.001
app.name=Пятак-130
app.locale_default=ru

# Colors (CSS / canvas)
color.bg=#1b4d3e
color.felt=#164536
color.text=#f5f0e6
color.muted=rgba(245,240,230,0.75)
color.accent=#c9a227
color.arrow=#ff3b5c
color.warn=#ffd24a
color.tile.face=#f5f0e6
color.tile.ai=#e8eef5
color.pip.human=#8b6914
color.pip.ai=#3a5a8c
color.spinner.border=#e8c84a
color.center.border=#d4a017

# Fonts
font.ui="Segoe UI", system-ui, -apple-system, sans-serif
font.size.title=1.15rem
font.size.status=0.82rem
font.size.log=0.72rem
font.size.hand_label=0.75rem

# Board layout
board.cell.max_px=40
board.cell.scale.normal=0.55
board.cell.scale.start=0.275
board.gap=0.14
board.tile.w_horiz=1.72
board.tile.h_horiz=0.88
board.tile.w_vert=0.88
board.tile.h_vert=1.72

# UI thresholds
ui.stones.low_threshold=2
ui.hand.tile_w_px=34
ui.hand.tile_h_px=68
ui.log.max_vh=42

# Debug export
debug.filename_prefix=five130tg_debug_v
debug.include_gfx=1


# --- Layout / bends (see docs/BEND_REQUIREMENTS.md) ---
# Profiles A–E proposed; active = A until user picks.
board.layout_profile=A
board.margin=0.06
board.cell.max_px=44
board.cell.min_px=22
board.cell.pref_frac=0.14
board.cell.scale.start=0.275
board.shrink.occupy=0.80
board.shrink.target=0.78
board.bend.occupy=0.70
board.bend.only_vertical_left=1
board.bend.main_line=0
# Alt B: bend=0.75 shrink=0.80 target=0.75 pref_frac=0.12 max=40
# Alt C: bend=0.80 shrink=0.85 target=0.80 pref_frac=0.13 max=42
# Alt D: bend=0.65 shrink=0.80 target=0.70 pref_frac=0.15 max=48
# Alt E: bend=0.80 shrink=0.80 target=0.80 pref_frac=0.12 max=40
