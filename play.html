  <!-- Entry alias: Telegram Desktop sometimes caches tg.html; play.html → fresh tg.html. -->

      var q = location.search || '';
      var h = location.hash || '';

      }
      location.replace('tg.html' + q + h);
    })();
  </script>
</head>
