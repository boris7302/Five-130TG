<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Пятак-130</title>
  <style>
    :root {
      --bg: #1b4d3e;
      --text: #f5f0e6;
      --muted: rgba(245, 240, 230, 0.75);
      --accent: #c9a227;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    body { display: flex; flex-direction: column; min-height: 100%; }
    header {
      padding: 12px 16px 8px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    header h1 { margin: 0; font-size: 1.2rem; font-weight: 800; }
    #score { font-weight: 700; white-space: nowrap; }
    #status { padding: 0 16px 8px; color: var(--muted); font-size: 0.9rem; min-height: 1.2em; }
    #board-wrap {
      flex: 1; margin: 0 12px; border-radius: 16px; overflow: hidden;
      border: 1px solid rgba(0,0,0,.25); background: #164536; min-height: 220px;
    }
    canvas { width: 100%; height: 100%; display: block; }
    #hand-label { padding: 8px 16px 4px; font-size: 0.85rem; color: var(--muted); }
    #hand { display: flex; gap: 8px; overflow-x: auto; padding: 4px 12px 8px; }
    .tile-btn, .move-btn {
      flex: 0 0 auto; min-width: 44px; height: 48px; border-radius: 8px;
      border: 2px solid #8b6914; background: #f5f0e6; color: #222;
      font-weight: 700; font-size: 14px; padding: 4px 6px; letter-spacing: 0.3px;
    }
    .move-btn { font-size: 12px; min-width: 72px; height: 44px; }
    .tile-btn.selected, .move-btn.selected {
      border-color: var(--accent); border-width: 3px; background: #fff3c4;
    }
    #moves-label { padding: 0 16px 4px; font-size: 0.85rem; color: var(--muted); }
    #moves { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 8px; min-height: 40px; }
    #actions { display: flex; gap: 10px; padding: 8px 16px; flex-wrap: wrap; }
    button.action {
      flex: 1; min-width: 88px; padding: 12px; border-radius: 12px; border: none;
      font-size: 0.95rem; font-weight: 600;
    }
    #bazaar, #newgame, #save, #list {
      background: transparent; color: var(--text);
      border: 1px solid rgba(245,240,230,.35);
    }
    #play { background: var(--accent); color: #1a1408; }
    #play:disabled { opacity: 0.45; }
    #store-status, #note {
      padding: 0 16px 8px; font-size: 0.75rem; color: var(--muted); text-align: center;
    }
    #log {
      max-height: 72px; overflow: auto; margin: 0 12px 10px; padding: 8px;
      background: rgba(0,0,0,.18); border-radius: 8px; font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Пятак-130</h1>
    <div id="score">0 : 0</div>
  </header>
  <div id="status">Загрузка…</div>
  <div id="board-wrap"><canvas id="board"></canvas></div>
  <div id="hand-label">Ваша рука</div>
  <div id="hand"></div>
  <div id="moves-label">Ходы</div>
  <div id="moves"></div>
  <div id="actions">
    <button class="action" id="play" type="button" disabled>Ход</button>
    <button class="action" id="bazaar" type="button">Базар</button>
    <button class="action" id="newgame" type="button">Новая</button>
    <button class="action" id="save" type="button">Сохранить</button>
    <button class="action" id="list" type="button">Партии</button>
  </div>
  <div id="store-status">MatchStore: …</div>
  <div id="log"></div>
  <div id="note">Движок JS (порт C++) · хранение ключ=значение</div>

  <script src="js/kv_parse.js"></script>
  <script src="js/match_store.js"></script>
  <script src="js/engine.js"></script>
  <script>
    (function () {
      try {
        var tw = window.Telegram && window.Telegram.WebApp;
        if (tw) {
          if (typeof tw.ready === 'function') tw.ready();
          if (typeof tw.expand === 'function') tw.expand();
        }
      } catch (e) {}

      var E = window.Five130Engine;
      if (!E) {
        document.getElementById('status').textContent = 'Движок не загружен';
        return;
      }

      var session = null;
      var selectedMove = null;
      var scoreEl = document.getElementById('score');
      var statusEl = document.getElementById('status');
      var handEl = document.getElementById('hand');
      var movesEl = document.getElementById('moves');
      var logEl = document.getElementById('log');
      var playBtn = document.getElementById('play');
      var storeStatus = document.getElementById('store-status');
      var canvas = document.getElementById('board');
      var wrap = document.getElementById('board-wrap');
      var ctx = canvas.getContext('2d');

      function setStoreStatus(msg) { storeStatus.textContent = msg; }
      try {
        setStoreStatus('MatchStore · owner=' + (window.Five130MatchStore
          ? Five130MatchStore.ownerId() : 'guest'));
      } catch (e) { setStoreStatus('MatchStore недоступен'); }

      function match() { return session && session.match; }
      function round() { return match() && match().round; }

      function refreshLog() {
        var r = round();
        if (!r) { logEl.textContent = ''; return; }
        logEl.textContent = r.actionLog.slice(-8).map(function (a) {
          return (a.player === E.HUMAN ? 'Вы' : 'ПК') + ': ' + a.text;
        }).join('\n');
      }

      function pipLayout(v) {
        var c = 0.5, n = 0.28, f = 0.72, m = 0.5;
        if (v === 0) return [];
        if (v === 1) return [[c, c]];
        if (v === 2) return [[n, n], [f, f]];
        if (v === 3) return [[n, n], [c, c], [f, f]];
        if (v === 4) return [[n, n], [f, n], [n, f], [f, f]];
        if (v === 5) return [[n, n], [f, n], [c, c], [n, f], [f, f]];
        if (v === 6) return [[n, 0.22], [f, 0.22], [n, m], [f, m], [n, 0.78], [f, 0.78]];
        return [[c, c]];
      }

      function drawTile(cx, cy, tile, cell) {
        var w = tile.horiz ? cell * 1.72 : cell * 0.88;
        var h = tile.horiz ? cell * 0.88 : cell * 1.72;
        var x = cx - w / 2, y = cy - h / 2, r = Math.max(6, cell * 0.12);
        ctx.fillStyle = tile.human ? '#f5f0e6' : '#e8eef5';
        ctx.strokeStyle = tile.isSpinner
          ? '#e8c84a'
          : (tile.isCenter ? '#d4a017' : (tile.human ? '#8b6914' : '#3a5a8c'));
        ctx.lineWidth = (tile.isCenter || tile.isSpinner) ? 3.5 : 2;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        if (tile.horiz) { ctx.moveTo(cx, y + 6); ctx.lineTo(cx, y + h - 6); }
        else { ctx.moveTo(x + 6, cy); ctx.lineTo(x + w - 6, cy); }
        ctx.strokeStyle = tile.human ? 'rgba(139,105,20,0.45)' : 'rgba(58,90,140,0.45)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        var color = tile.human ? '#8b6914' : '#3a5a8c';
        function pips(hx, hy, hw, hh, val) {
          var pr = Math.min(hw, hh) * 0.1;
          pipLayout(val).forEach(function (p) {
            ctx.beginPath();
            ctx.fillStyle = color;
            ctx.arc(hx + hw * p[0], hy + hh * p[1], pr, 0, Math.PI * 2);
            ctx.fill();
          });
        }
        if (tile.horiz) {
          pips(x, y, w / 2, h, tile.a);
          pips(cx, y, w / 2, h, tile.b);
        } else {
          pips(x, y, w, h / 2, tile.a);
          pips(x, cy, w, h / 2, tile.b);
        }
      }

      function paint() {
        var r = round();
        var placed = r ? E.boardSnapshot(r.board) : [];
        var dpr = window.devicePixelRatio || 1;
        var rect = wrap.getBoundingClientRect();
        canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        canvas.height = Math.max(1, Math.floor(rect.height * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var W = rect.width, H = rect.height;
        ctx.fillStyle = '#164536';
        ctx.fillRect(0, 0, W, H);
        if (!placed.length) return;

        var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        placed.forEach(function (t) {
          var hw = (t.horiz ? 1.72 : 0.88) / 2;
          var hh = (t.horiz ? 0.88 : 1.72) / 2;
          minX = Math.min(minX, t.x - hw);
          maxX = Math.max(maxX, t.x + hw);
          minY = Math.min(minY, t.y - hh);
          maxY = Math.max(maxY, t.y + hh);
        });
        var pad = 0.55;
        minX -= pad; maxX += pad; minY -= pad; maxY += pad;
        var bw = Math.max(0.01, maxX - minX);
        var bh = Math.max(0.01, maxY - minY);
        var cell = Math.min((W * 0.92) / bw, (H * 0.92) / bh) * 0.55;
        var ox = W / 2 - ((minX + maxX) / 2) * cell;
        var oy = H / 2 - ((minY + maxY) / 2) * cell;
        placed.forEach(function (t) {
          drawTile(ox + t.x * cell, oy + t.y * cell, t, cell);
        });
      }

      function renderHand() {
        handEl.innerHTML = '';
        var r = round();
        if (!r) return;
        r.hands[E.HUMAN].forEach(function (t) {
          var b = document.createElement('button');
          b.className = 'tile-btn';
          b.type = 'button';
          b.textContent = t.label;
          b.disabled = true;
          handEl.appendChild(b);
        });
      }

      function renderMoves() {
        movesEl.innerHTML = '';
        selectedMove = null;
        playBtn.disabled = true;
        var r = round();
        var m = match();
        if (!r || !m || m.matchOver || r.roundOver || r.currentPlayer !== E.HUMAN) return;
        var moves = E.legalMoves(r);
        moves.forEach(function (mv, i) {
          var b = document.createElement('button');
          b.className = 'move-btn';
          b.type = 'button';
          b.textContent = E.moveLabel(mv);
          b.onclick = function () {
            selectedMove = mv;
            Array.prototype.forEach.call(movesEl.children, function (c, j) {
              c.classList.toggle('selected', j === i);
            });
            playBtn.disabled = false;
          };
          movesEl.appendChild(b);
        });
      }

      function updateStatus() {
        var m = match();
        var r = round();
        if (!m || !r) return;
        scoreEl.textContent = m.scores[0] + ' : ' + m.scores[1];
        var bits = [];
        if (m.matchOver) bits.push(m.statusLine || 'Партия окончена');
        else if (r.roundOver) bits.push('Игра окончена · ' + (r.message || r.endReason || ''));
        else bits.push(r.currentPlayer === E.HUMAN ? 'Ваш ход' : 'Ход компьютера');
        if (r.message) bits.push(r.message);
        if (m.statusLine && !m.matchOver) bits.push(m.statusLine);
        if (r.board && r.board.hasCenter) {
          var anchor = E.centerLabel(r.board);
          var spin = E.spinnerLabel(r.board);
          if (spin && spin !== anchor) {
            bits.push('якорь ' + anchor + ', спиннер ' + spin);
          } else if (spin) {
            bits.push('спиннер ' + spin);
          } else if (anchor) {
            bits.push('якорь ' + anchor);
          }
        }
        statusEl.textContent = bits.join(' · ');
      }

      function afterHumanOrAi() {
        var m = match();
        var r = round();
        if (!m || !r) return;
        if (r.roundOver) {
          var delta = E.settleRound(r);
          E.applyRoundResult(m, r, delta);
          statusEl.textContent = delta.summary + (m.matchOver ? (' · ' + m.statusLine) : '');
          if (!m.matchOver) {
            setTimeout(function () {
              E.startRound(m, session.rng);
              drainAi();
              refreshUi();
            }, 700);
            refreshUi();
            return;
          }
        }
        refreshUi();
        drainAi();
      }

      function drainAi() {
        var m = match();
        var r = round();
        var guard = 0;
        while (m && r && !m.matchOver && !r.roundOver && r.currentPlayer === E.AI && guard++ < 40) {
          E.runAiTurn(m);
          r = round();
          if (r && r.roundOver) {
            var delta = E.settleRound(r);
            E.applyRoundResult(m, r, delta);
            if (!m.matchOver) {
              E.startRound(m, session.rng);
              r = round();
              continue;
            }
            break;
          }
        }
        refreshUi();
      }

      function refreshUi() {
        updateStatus();
        renderHand();
        renderMoves();
        refreshLog();
        paint();
      }

      function newGame() {
        session = E.createMatch({ gameType: 'five130' });
        selectedMove = null;
        drainAi();
        refreshUi();
      }

      playBtn.onclick = function () {
        var r = round();
        if (!r || !selectedMove || r.currentPlayer !== E.HUMAN) return;
        if (!E.applyMove(r, selectedMove)) {
          alert(r.message || 'Недопустимый ход');
          refreshUi();
          return;
        }
        afterHumanOrAi();
      };

      document.getElementById('bazaar').onclick = function () {
        var r = round();
        if (!r || r.currentPlayer !== E.HUMAN || r.roundOver) return;
        if (E.legalMoves(r).length) {
          alert('Есть ход — рынок не нужен');
          return;
        }
        E.drawFromMarket(r);
        afterHumanOrAi();
      };

      document.getElementById('newgame').onclick = function () {
        if (confirm('Начать новую партию?')) newGame();
      };

      document.getElementById('save').onclick = function () {
        if (!window.Five130MatchStore || !match()) return;
        var m = match();
        Five130MatchStore.saveStubFromUi({
          final_score: m.scores[0] + ',' + m.scores[1],
          match_winner: m.matchOver ? String(m.matchWinner) : '-1',
          match_draw: m.matchDraw ? '1' : '0',
          match_over: m.matchOver ? '1' : '0',
          status: m.statusLine || 'in-progress',
          game_type: m.gameType,
          seed: String(m.seed),
        }).then(function (res) {
          setStoreStatus('Сохранено · ' + res.match_id);
          alert('Сохранено: ' + res.match_id);
        }).catch(function (err) { alert(String(err)); });
      };

      document.getElementById('list').onclick = function () {
        if (!window.Five130MatchStore) return;
        Five130MatchStore.listMatches().then(function (idx) {
          if (!idx.items.length) {
            alert('Партий нет (owner=' + idx.owner + ')');
            return;
          }
          alert(idx.items.slice(0, 12).map(function (it, i) {
            return (i + 1) + '. ' + it.id + ' · ' + it.final_score + ' · ' + it.result;
          }).join('\n'));
        });
      };

      window.addEventListener('resize', paint);
      newGame();
    })();
  </script>
</body>
</html>
